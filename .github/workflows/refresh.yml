# Refreshes the catalogue from YouTube, exports static data, redeploys the site to Vercel and
# stores the metadata cache as a release asset so the next run is incremental.
name: Refresh catalogue & deploy

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      full:
        description: 'Restart the complete provider crawl'
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_PRODUCT: flixer
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix server && npm ci --prefix client
      - name: Restore data snapshot
        run: node scripts/snapshot.js restore
      - name: Continue complete Arabic catalogue traversal and sample playback routes
        run: node scripts/audit-arabic.js --crawl --pages 180 --samples 1
      - name: Preserve Arabic source coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-source-audit
          path: artifacts/arabic-audit.json
          if-no-files-found: ignore
      - name: Fill missing metadata from provider pages
        run: node scripts/fill-provider-metadata.js --limit 200
      - name: Resolve cached HDToday identities through verified alternate metadata
        run: node scripts/fill-provider-metadata.js --provider hdtoday --limit 120
      - name: Refresh Flixer providers
        id: refresh
        run: node scripts/refresh-providers.js --product flixer --pages 180 --matches 100 ${{ inputs.full && '--full' || '' }}
      # "vercel build" runs the buildCommand from vercel.json (static build with the exported data);
      # the prebuilt deploy then uploads the result, including the data files that git ignores.
      - name: Build & deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          node scripts/prepare-deployment.js flixer
          # --archive=tgz: one upload instead of ~13k files (the free plan caps file uploads at 5000/day)
          vercel deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
      - name: Build site (no Vercel token configured)
        if: env.VERCEL_TOKEN == ''
        run: node scripts/product.js flixer build
      - name: Save data snapshot
        id: snapshot
        if: always()
        run: node scripts/snapshot.js save
      - name: Deploy refreshed snapshot through the project hook
        if: steps.refresh.outcome == 'success' && steps.snapshot.outcome == 'success' && env.VERCEL_TOKEN == '' && env.VERCEL_DEPLOY_HOOK != ''
        run: |
          node --input-type=module - <<'NODE'
          const response = await fetch(process.env.VERCEL_DEPLOY_HOOK.trim(), { method: 'POST', signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error(`Snapshot deployment failed: HTTP ${response.status}`);
          console.log('Flixer deployment requested with the refreshed snapshot.');
          NODE
