# Updates catalogue data independently of the deployed application.
# Application code is deployed explicitly; scheduled refreshes never call deployment hooks.
name: Refresh catalogue data

on:
  schedule:
    - cron: '17 */2 * * *'   # historical catalogue traversal
    - cron: '47 * * * *'     # latest releases
    - cron: '2,32 * * * *'   # latest releases every 15 minutes overall
    - cron: '17 1-23/2 * * *' # latest releases between historical runs
  workflow_dispatch:
    inputs:
      full:
        description: 'Restart the complete provider crawl'
        type: boolean
        default: false
      latest_only:
        description: 'Refresh current releases without the historical crawl'
        type: boolean
        default: false
      official_backfill:
        description: 'Continue official Arabic and Tunisian archives during this refresh'
        type: boolean
        default: false
      stardima_backfill:
        description: 'Continue up to 600 free StarDima catalogue pages without restarting saved cursors'
        type: boolean
        default: false
      carateen_backfill:
        description: 'Import the public Carateen catalogue snapshot without crawling episode guides'
        type: boolean
        default: false
      dessin_browser_backfill:
        description: 'Export a fresh source seed for the independent DessinAnime browser runner'
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_PRODUCT: flixer
      FLIXER_PACKED_EXPORT: '1'
      GH_TOKEN: ${{ github.token }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix server && npm ci --prefix client
      - name: Restore data snapshot
        run: node scripts/snapshot.js restore
      - name: Continue free StarDima catalogue backfill
        if: inputs.stardima_backfill || github.event.schedule == '17 */2 * * *'
        run: |
          if [ "${{ inputs.stardima_backfill }}" = true ]; then
            node scripts/import-stardima.js --pages 600
          else
            node scripts/import-stardima.js --pages 24
          fi
      - name: Import the public Carateen catalogue snapshot
        if: inputs.carateen_backfill
        run: node scripts/import-carateen.js --max-seconds 90
      - name: Preserve Carateen source coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carateen-source-coverage
          path: artifacts/carateen-import.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve StarDima source coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stardima-source-coverage
          path: artifacts/stardima-import.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Apply reviewed Arabic source identities
        run: node scripts/import-reviewed-sources.js
      - name: Apply reviewed DessinAnime episode metadata
        run: node scripts/import-dessinanime-metadata.js server/seeds/dessinanime-reviewed.json
      - name: Load independent DessinAnime browser discoveries
        run: node scripts/dessin-artifacts.js metadata
      - name: Merge validated DessinAnime browser discoveries
        continue-on-error: true
        run: |
          if [ -f artifacts/dessin-worker-metadata.json ]; then
            node scripts/import-dessinanime-metadata.js artifacts/dessin-worker-metadata.json --browser
          fi
      - name: Export lightweight DessinAnime catalogue seed
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */2 * * *'
        run: node scripts/dessin-artifacts.js export
      - name: Share source seed with the browser runner
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */2 * * *'
        uses: actions/upload-artifact@v4
        with:
          name: dessinanime-catalogue-seed
          path: artifacts/dessin-catalogue-seed.json
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
      - name: Continue official Arabic and Tunisian source backfill
        if: inputs.official_backfill || (github.event_name != 'schedule' && !inputs.latest_only) || github.event.schedule == '17 */2 * * *'
        run: node scripts/import-official-arabic.js --pages 36
      - name: Continue complete Arabic catalogue traversal and sample playback routes
        if: (github.event_name != 'schedule' && !inputs.latest_only) || github.event.schedule == '17 */2 * * *'
        run: node scripts/audit-arabic.js --crawl --pages 180 --samples 1
      - name: Preserve Arabic source coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-source-audit
          path: |
            artifacts/arabic-audit.json
            artifacts/official-arabic-import.json
          if-no-files-found: ignore
      - name: Fill missing metadata from provider pages
        if: (github.event_name != 'schedule' && !inputs.latest_only) || github.event.schedule == '17 */2 * * *'
        run: node scripts/fill-provider-metadata.js --limit 200
      - name: Resolve cached HDToday identities through verified alternate metadata
        if: (github.event_name != 'schedule' && !inputs.latest_only) || github.event.schedule == '17 */2 * * *'
        run: node scripts/fill-provider-metadata.js --provider hdtoday --limit 120
      - name: Refresh Flixer providers
        id: refresh
        run: |
          if [ "${{ inputs.latest_only }}" = true ] || { [ "${{ github.event_name }}" = schedule ] && [ "${{ github.event.schedule }}" != '17 */2 * * *' ]; }; then
            node scripts/refresh-providers.js --product flixer --latest-only --pages 0 --matches 0 --services 0
          else
            node scripts/refresh-providers.js --product flixer --pages 180 --matches 100 ${{ inputs.full && '--full' || '' }}
          fi
      - name: Save data snapshot
        id: snapshot
        if: always()
        run: node scripts/snapshot.js save
      - name: Publish live catalogue data
        if: steps.refresh.outcome == 'success' && steps.snapshot.outcome == 'success'
        run: node scripts/publish-runtime.js
