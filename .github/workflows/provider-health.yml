name: Provider health diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hdtoday:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-hdtoday.js
